name: Snake de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f4fbf&color_dots=#ebedf0,#b6d4fe,#6ea8fe,#2f6fe0,#0a3a8a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#61dafb&color_dots=#161b22,#0a1f44,#123a85,#1f6feb,#61dafb

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
